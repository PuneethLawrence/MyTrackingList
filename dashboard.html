<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTrackingList - Dashboard</title>
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body style="background-color: #0f172a; color: #fff; font-family: sans-serif; margin: 0; padding: 0;">
  
  <!-- TOP NAVIGATION HEADER -->
 
<!-- TOP NAVIGATION HEADER -->
<header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #1e293b; border-bottom: 1px solid rgba(255,255,255,0.1);">
  <!-- Hamburger Button -->
  <button id="mobile-menu-btn" class="hamburger-btn" aria-label="Toggle Categories">☰</button>
  
  <!-- Title -->
  <h2 style="margin: 0; font-size: 1.2rem;">MyTrackingList</h2>
  
  <!-- Sign Out Button -->
  <button id="signout-btn" class="btn btn-secondary" style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: #ef4444; padding: 8px 16px; cursor: pointer; border-radius: 6px;">Sign Out</button>
</header>

  <!-- DASHBOARD LAYOUT -->
 <div class="dashboard-layout" style="display: flex; min-height: calc(100vh - 65px);">

    <!-- LEFT SIDEBAR: CATEGORIES -->

    <!-- Add this backdrop right above your <aside> sidebar -->
<div id="sidebar-overlay" class="sidebar-overlay"></div>

<!-- Inside your top <header>, place this button right before <h1 id="current-category-title"> -->


  <aside style="width: 250px; background: #111413; border-right: 1px solid rgba(255,255,255,0.1); padding: 20px; box-sizing: border-box;">

    <!-- Mobile Header: Close Button on the Left, Title next to it -->
    <div class="sidebar-header-mobile" style="display: none; align-items: center; gap: 12px; padding: 0 0 16px 0; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 16px;">
      <button id="sidebar-close-btn" aria-label="Close Menu" style="background: transparent; border: none; color: #10b981; font-size: 1.3rem; cursor: pointer; padding: 0; line-height: 1;">✕</button>
      <span style="font-weight: 600; color: #fff; font-size: 1.1rem;">Categories</span>
    </div>
    
   <!-- Sidebar Category List -->
      <ul id="category-list" style="list-style: none; padding: 0; margin: 0;">
        <!-- Will be populated dynamically by loadCategories() -->
      </ul>

    <button id="open-category-modal-btn" style="width: 100%; padding: 10px; background: transparent; border: 1px dashed rgba(255,255,255,0.2); color: #10b981; border-radius: 6px; cursor: pointer; font-weight: 500;">
      + Add Category
    </button>
  </aside>

      <!-- MAIN CONTENT AREA -->
<main style="flex: 1; padding: 30px; background: #0f172a;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1 id="current-category-title" style="margin: 0; font-size: 1.5rem; color: #fff;">Loading...</h1>
    
    <!-- Button Group (Edit + Delete) -->
    <div style="display: flex; gap: 10px; align-items: center;">
      <button id="edit-category-btn" style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); color: #60a5fa; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500;">Edit Category</button>
      <button id="delete-category-btn" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500;">Delete Category</button>
    </div>
  </div>

  <!-- Media Grid Container -->
  <div id="media-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;">
    
    <!-- Add Item Card (Acts as the first grid tile) -->
    <div onclick="openAddItemModal()" style="background: rgba(255,255,255,0.03); border: 2px dashed #334155; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 180px; cursor: pointer; color: #9ca3af; font-weight: 500; transition: border-color 0.2s;">
      <span style="font-size: 1.8rem; margin-bottom: 4px; color: #10b981;">+</span>
      <span>Add Item</span>
    </div>

    <!-- Dynamic item cards will be injected here next to it -->
  </div>
</main>

  </div>

  <!-- ADD CATEGORY MODAL -->
  <div id="add-category-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; width: 90%; max-width: 400px; padding: 24px; box-sizing: border-box;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="color: #fff; margin: 0;">Add Category</h3>
        <button id="close-category-modal-btn" style="background: none; border: none; color: #9ca3af; font-size: 1.4rem; cursor: pointer;">&times;</button>
      </div>
      
      <form id="add-category-form">
        <div style="margin-bottom: 16px; text-align: left;">
          <label for="category-name-input" style="display: block; color: #9ca3af; font-size: 0.85rem; margin-bottom: 6px;">Category Name</label>
          <input type="text" id="category-name-input" placeholder="e.g., Manhwa, Games, Movies" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; box-sizing: border-box;">
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" id="cancel-category-btn" style="padding: 8px 16px; background: #334155; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Cancel</button>
          <button type="submit" style="padding: 8px 16px; background: #6366f1; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Create</button>
        </div>
      </form>
    </div>
  </div>

<!-- EDIT CATEGORY MODAL -->
  <div id="edit-category-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; width: 90%; max-width: 400px; padding: 24px; box-sizing: border-box;">
      <h3 style="color: #fff; margin-top: 0; margin-bottom: 16px;">Edit Category</h3>
      <form id="edit-category-form">
        <div style="margin-bottom: 20px;">
          <label style="display: block; color: #9ca3af; font-size: 0.85rem; margin-bottom: 6px;">Category Name</label>
          <input type="text" id="edit-category-input" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box;">
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" id="cancel-edit-category-btn" style="padding: 8px 16px; background: #334155; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Cancel</button>
          <button type="submit" style="padding: 8px 16px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Save</button>
        </div>
      </form>
    </div>
  </div>


  <!-- DELETE CATEGORY CONFIRMATION MODAL (Place it here) -->
    <div id="delete-category-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 1000;">
      <div style="background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; width: 90%; max-width: 420px; padding: 24px; box-sizing: border-box; text-align: left;">
        <h3 style="color: #fff; margin-top: 0; margin-bottom: 12px;">Delete Category?</h3>
        <p id="delete-category-warning" style="color: #9ca3af; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px;">
          Are you sure you want to delete this category? Deleting this category will result in all your entries in your category permanently deleted.
        </p>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" id="cancel-delete-btn" style="padding: 8px 16px; background: #334155; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Cancel</button>
          <button type="button" id="confirm-delete-btn" style="padding: 8px 16px; background: #ef4444; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Delete Permanently</button>
        </div>
      </div>
    </div>


    
<!-- ADD / EDIT ITEM MODAL -->
  <div id="item-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; width: 90%; max-width: 450px; padding: 24px; box-sizing: border-box;">
      <h3 id="item-modal-title" style="color: #fff; margin-top: 0; margin-bottom: 16px;">Add Item</h3>
      
      <form id="item-form">
        <!-- Hidden input to store item ID when editing -->
        <input type="hidden" id="edit-item-id" value="">

        <div style="margin-bottom: 16px;">
          <label style="display: block; color: #9ca3af; font-size: 0.85rem; margin-bottom: 6px;">Image URL</label>
          <input type="url" id="item-image-input" placeholder="https://example.com/image.jpg" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 16px;">
          <label style="display: block; color: #9ca3af; font-size: 0.85rem; margin-bottom: 6px;">Name</label>
          <input type="text" id="item-name-input" required placeholder="e.g. Solo Leveling" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 16px;">
          <label style="display: block; color: #9ca3af; font-size: 0.85rem; margin-bottom: 6px;">Status</label>
          <select id="item-status-select" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box;">
            <option value="Reading">Reading / Playing</option>
            <option value="Completed">Completed</option>
            <option value="Plan to Watch">Plan to Watch / Play</option>
            <option value="Dropped">Dropped</option>
          </select>
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; color: #9ca3af; font-size: 0.85rem; margin-bottom: 6px;">Description</label>
          <textarea id="item-desc-input" rows="3" placeholder="Add a short description..." style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box; resize: vertical;"></textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" id="cancel-item-btn" style="padding: 8px 16px; background: #334155; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Cancel</button>
          <button type="submit" id="save-item-btn" style="padding: 8px 16px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Auth Script (handles sign out session protection) -->
  <script type="module" src="js/auth.js"></script>
  <!-- Dashboard Interactivity Script -->
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
